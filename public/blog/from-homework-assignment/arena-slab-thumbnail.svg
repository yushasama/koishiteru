<svg xmlns="http://www.w3.org/2000/svg" width="144" height="140" viewBox="0 0 144 140" role="img" aria-labelledby="arena-title arena-description"><title id="arena-title">Arena allocator and bump pointer</title><desc id="arena-description">A conceptual horizontal 64-byte arena. From left to right, a u32, three f32 values, and two u64 values occupy the first 32 bytes. The bump pointer marks the first unused byte. The remaining 32 bytes form one continuous free suffix. Depth is illustrative; no individual allocation is detached from the buffer.</desc><defs><linearGradient id="allocation-0" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#90d6de" stop-opacity=".36"/><stop offset=".44" stop-color="#90d6de" stop-opacity=".2"/><stop offset="1" stop-color="#90d6de" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cb6db" stop-opacity=".36"/><stop offset=".44" stop-color="#8cb6db" stop-opacity=".2"/><stop offset="1" stop-color="#8cb6db" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5bde5" stop-opacity=".36"/><stop offset=".44" stop-color="#b5bde5" stop-opacity=".2"/><stop offset="1" stop-color="#b5bde5" stop-opacity=".085"/></linearGradient><pattern id="free-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0V6" stroke="#91a7b9" stroke-opacity=".1" stroke-width=".8"/></pattern><filter id="frontier-glow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter><radialGradient id="atmosphere"><stop stop-color="#213245" stop-opacity=".26"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient></defs><rect width="144" height="140" fill="#070707"/><ellipse cx="72" cy="77" rx="69.12" ry="64.4" fill="url(#atmosphere)"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><path d="M65 88H124v8H65z" fill="#0b1016" stroke="#697e8e" stroke-opacity=".35" stroke-width="0.7"/><path d="M124 88l14 -28v8l-14 28z" fill="#101923" stroke="#718694" stroke-opacity=".4" stroke-width="0.7"/><polygon points="65,88 79,60 138,60 124,88" fill="#0c131b" stroke="#718694" stroke-opacity=".6" stroke-width="0.7"/><polygon points="65,88 79,60 138,60 124,88" fill="url(#free-hatch)"/><path d="M6 88h7.375v8H6z" fill="#90d6de" fill-opacity=".065" stroke="#90d6de" stroke-opacity=".24" stroke-width="0.7"/><polygon points="6,88 20,60 27.375,60 13.375,88" fill="url(#allocation-0)" stroke="#90d6de" stroke-opacity=".6" stroke-width="0.7"/><path d="M13.375 88h22.125v8H13.375z" fill="#8cb6db" fill-opacity=".065" stroke="#8cb6db" stroke-opacity=".24" stroke-width="0.7"/><polygon points="13.375,88 27.375,60 49.5,60 35.5,88" fill="url(#allocation-1)" stroke="#8cb6db" stroke-opacity=".6" stroke-width="0.7"/><path d="M35.5 88h29.5v8H35.5z" fill="#b5bde5" fill-opacity=".065" stroke="#b5bde5" stroke-opacity=".24" stroke-width="0.7"/><polygon points="35.5,88 49.5,60 79,60 65,88" fill="url(#allocation-2)" stroke="#b5bde5" stroke-opacity=".6" stroke-width="0.7"/><path d="M79 60L65 88v8" fill="none" stroke="#fb4e7c" stroke-width="3" opacity=".35" filter="url(#frontier-glow)"/><path d="M79 60L65 88v8" fill="none" stroke="#ff719d" stroke-width="1.5"/><path d="M79 48V55" stroke="#ff96b6" stroke-width="1.2"/><path d="M76 53l3 5 3-5z" fill="#ff96b6"/><text x="7" y="22" fill="#dbe5eb" font-size="15" font-weight="600">arena</text><text x="79" y="42" text-anchor="middle" fill="#ff96b6" font-size="13">bump</text><text x="35.5" y="121" text-anchor="middle" fill="#adbdcc" font-size="13">used</text><text x="94.5" y="121" text-anchor="middle" fill="#91a0ab" font-size="13">free</text></g></svg>
