<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="arena-title arena-description"><title id="arena-title">Arena allocator and bump pointer</title><desc id="arena-description">A conceptual horizontal 64-byte arena. From left to right, a u32, three f32 values, and two u64 values occupy the first 32 bytes. The bump pointer marks the first unused byte. The remaining 32 bytes form one continuous free suffix. Depth is illustrative; no individual allocation is detached from the buffer.</desc><defs><linearGradient id="allocation-0" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#90d6de" stop-opacity=".36"/><stop offset=".44" stop-color="#90d6de" stop-opacity=".2"/><stop offset="1" stop-color="#90d6de" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cb6db" stop-opacity=".36"/><stop offset=".44" stop-color="#8cb6db" stop-opacity=".2"/><stop offset="1" stop-color="#8cb6db" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5bde5" stop-opacity=".36"/><stop offset=".44" stop-color="#b5bde5" stop-opacity=".2"/><stop offset="1" stop-color="#b5bde5" stop-opacity=".085"/></linearGradient><pattern id="free-hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0V13" stroke="#91a7b9" stroke-opacity=".1" stroke-width=".8"/></pattern><filter id="frontier-glow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="4"/></filter><radialGradient id="atmosphere"><stop stop-color="#213245" stop-opacity=".26"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient></defs><rect width="900" height="440" fill="#070707"/><ellipse cx="450" cy="242.00000000000003" rx="432" ry="202.4" fill="url(#atmosphere)"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><path d="M422 246H794v22H422z" fill="#0b1016" stroke="#697e8e" stroke-opacity=".35" stroke-width="1.15"/><path d="M794 246l48 -96v22l-48 96z" fill="#101923" stroke="#718694" stroke-opacity=".4" stroke-width="1.15"/><polygon points="422,246 470,150 842,150 794,246" fill="#0c131b" stroke="#718694" stroke-opacity=".6" stroke-width="1.15"/><polygon points="422,246 470,150 842,150 794,246" fill="url(#free-hatch)"/><path d="M50 246h46.5v22H50z" fill="#90d6de" fill-opacity=".065" stroke="#90d6de" stroke-opacity=".24" stroke-width="1.15"/><polygon points="50,246 98,150 144.5,150 96.5,246" fill="url(#allocation-0)" stroke="#90d6de" stroke-opacity=".6" stroke-width="1.15"/><text x="97.25" y="204" text-anchor="middle" fill="#90d6de" font-size="18">u32</text><path d="M96.5 246h139.5v22H96.5z" fill="#8cb6db" fill-opacity=".065" stroke="#8cb6db" stroke-opacity=".24" stroke-width="1.15"/><polygon points="96.5,246 144.5,150 284,150 236,246" fill="url(#allocation-1)" stroke="#8cb6db" stroke-opacity=".6" stroke-width="1.15"/><text x="190.25" y="204" text-anchor="middle" fill="#8cb6db" font-size="18">f32[3]</text><path d="M236 246h186v22H236z" fill="#b5bde5" fill-opacity=".065" stroke="#b5bde5" stroke-opacity=".24" stroke-width="1.15"/><polygon points="236,246 284,150 470,150 422,246" fill="url(#allocation-2)" stroke="#b5bde5" stroke-opacity=".6" stroke-width="1.15"/><text x="353" y="204" text-anchor="middle" fill="#b5bde5" font-size="18">u64[2]</text><path d="M470 150L422 246v22" fill="none" stroke="#fb4e7c" stroke-width="7" opacity=".35" filter="url(#frontier-glow)"/><path d="M470 150L422 246v22" fill="none" stroke="#ff719d" stroke-width="2"/><path d="M470 105V145" stroke="#ff96b6" stroke-width="1.5"/><path d="M466 143l4 7 4-7z" fill="#ff96b6"/><text x="470" y="87" text-anchor="middle" fill="#ff96b6" font-size="22" font-weight="500">bump pointer</text><text x="632" y="204" text-anchor="middle" fill="#8698a5" font-size="19">unallocated</text><path d="M50 278v8M794 278v8" stroke="#71818d" stroke-opacity=".5"/><text x="50" y="311" fill="#92a2ae" font-size="15">base</text><text x="794" y="311" text-anchor="end" fill="#92a2ae" font-size="15">end</text></g></svg>
