<svg xmlns="http://www.w3.org/2000/svg" width="144" height="176" viewBox="0 0 144 176" role="img" aria-labelledby="arena-title arena-description"><title id="arena-title">Arena allocator</title><desc id="arena-description">Conceptual 64-byte buffer. A u32 occupies bytes 0 through 3, three f32 values occupy bytes 4 through 15, and two u64 values occupy bytes 16 through 31. The cursor points to byte 32. The remaining 32 bytes are free; end points one past byte 63. Addresses are hexadecimal.</desc><rect width="144" height="176" fill="#090d11"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="7" y="23" font-size="16" font-weight="700" fill="#f2f2f2">Arena</text><text x="138" y="23" text-anchor="end" font-size="12" fill="#8d969b">64 B</text><rect x="38" y="43" width="100" height="112" fill="#0e1317" stroke="#677077" stroke-width="1"/><rect x="38" y="43" width="25" height="28" fill="#193b42" stroke="#88cbd3" stroke-opacity=".55"/><text x="50.5" y="61" fill="#88cbd3" font-size="12" font-weight="600" text-anchor="middle">u32</text><rect x="63" y="43" width="75" height="28" fill="#442435" stroke="#ff91b2" stroke-opacity=".55"/><text x="100.5" y="61" fill="#ff91b2" font-size="12" font-weight="600" text-anchor="middle">f32[3]</text><rect x="38" y="71" width="100" height="28" fill="#253345" stroke="#a2bfdc" stroke-opacity=".55"/><text x="88" y="89" fill="#a2bfdc" font-size="12" font-weight="600" text-anchor="middle">u64[2]</text><g fill="none" stroke="#c4d4dc" stroke-opacity=".055" stroke-width=".7"><path d="M38 71h100"/><path d="M38 99h100"/><path d="M38 127h100"/><path d="M44.25 43v112"/><path d="M50.5 43v112"/><path d="M56.75 43v112"/><path d="M63 43v112"/><path d="M69.25 43v112"/><path d="M75.5 43v112"/><path d="M81.75 43v112"/><path d="M88 43v112"/><path d="M94.25 43v112"/><path d="M100.5 43v112"/><path d="M106.75 43v112"/><path d="M113 43v112"/><path d="M119.25 43v112"/><path d="M125.5 43v112"/><path d="M131.75 43v112"/></g><text x="33" y="61" fill="#889095" text-anchor="end" font-size="12">0x00</text><text x="33" y="89" fill="#889095" text-anchor="end" font-size="12">0x10</text><text x="33" y="117" fill="#ff719b" text-anchor="end" font-size="12">0x20</text><text x="33" y="145" fill="#889095" text-anchor="end" font-size="12">0x30</text><path d="M32 99H138" stroke="#ff719b" stroke-width="1.5"/><path d="M30 95l6 4-6 4" fill="none" stroke="#ff719b" stroke-width="1.5"/><text x="88" y="117" fill="#ff91b2" font-size="12" text-anchor="middle">cursor</text><text x="88" y="145" fill="#7f8b93" font-size="12" text-anchor="middle">free</text><text x="138" y="170" text-anchor="end" font-size="12" fill="#707b82">0x40 end</text></g></svg>
