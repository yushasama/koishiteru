<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-labelledby="arena-title arena-description"><title id="arena-title">Arena allocator and bump pointer</title><desc id="arena-description">A conceptual horizontal 64-byte arena. From left to right, a u32, three f32 values, and two u64 values occupy the first 32 bytes. The bump pointer marks the first unused byte. The remaining 32 bytes form one continuous free suffix. Depth is illustrative; no individual allocation is detached from the buffer.</desc><defs><linearGradient id="allocation-0" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#90d6de" stop-opacity=".36"/><stop offset=".44" stop-color="#90d6de" stop-opacity=".2"/><stop offset="1" stop-color="#90d6de" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cb6db" stop-opacity=".36"/><stop offset=".44" stop-color="#8cb6db" stop-opacity=".2"/><stop offset="1" stop-color="#8cb6db" stop-opacity=".085"/></linearGradient><linearGradient id="allocation-2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5bde5" stop-opacity=".36"/><stop offset=".44" stop-color="#b5bde5" stop-opacity=".2"/><stop offset="1" stop-color="#b5bde5" stop-opacity=".085"/></linearGradient><pattern id="free-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0V6" stroke="#91a7b9" stroke-opacity=".1" stroke-width=".8"/></pattern><filter id="frontier-glow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter><radialGradient id="atmosphere"><stop stop-color="#213245" stop-opacity=".26"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient></defs><rect width="400" height="190" fill="#070707"/><ellipse cx="200" cy="104.50000000000001" rx="192" ry="87.4" fill="url(#atmosphere)"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><path d="M183 114H346v10H183z" fill="#0b1016" stroke="#697e8e" stroke-opacity=".35" stroke-width="0.7"/><path d="M346 114l25 -35v10l-25 35z" fill="#101923" stroke="#718694" stroke-opacity=".4" stroke-width="0.7"/><polygon points="183,114 208,79 371,79 346,114" fill="#0c131b" stroke="#718694" stroke-opacity=".6" stroke-width="0.7"/><polygon points="183,114 208,79 371,79 346,114" fill="url(#free-hatch)"/><path d="M20 114h20.375v10H20z" fill="#90d6de" fill-opacity=".065" stroke="#90d6de" stroke-opacity=".24" stroke-width="0.7"/><polygon points="20,114 45,79 65.375,79 40.375,114" fill="url(#allocation-0)" stroke="#90d6de" stroke-opacity=".6" stroke-width="0.7"/><path d="M40.375 114h61.125v10H40.375z" fill="#8cb6db" fill-opacity=".065" stroke="#8cb6db" stroke-opacity=".24" stroke-width="0.7"/><polygon points="40.375,114 65.375,79 126.5,79 101.5,114" fill="url(#allocation-1)" stroke="#8cb6db" stroke-opacity=".6" stroke-width="0.7"/><path d="M101.5 114h81.5v10H101.5z" fill="#b5bde5" fill-opacity=".065" stroke="#b5bde5" stroke-opacity=".24" stroke-width="0.7"/><polygon points="101.5,114 126.5,79 208,79 183,114" fill="url(#allocation-2)" stroke="#b5bde5" stroke-opacity=".6" stroke-width="0.7"/><path d="M208 79L183 114v10" fill="none" stroke="#fb4e7c" stroke-width="3" opacity=".35" filter="url(#frontier-glow)"/><path d="M208 79L183 114v10" fill="none" stroke="#ff719d" stroke-width="1.5"/><path d="M208 55V74" stroke="#ff96b6" stroke-width="1.2"/><path d="M205 72l3 5 3-5z" fill="#ff96b6"/><text x="208" y="49" text-anchor="middle" fill="#ff96b6" font-size="20">bump pointer</text><text x="101.5" y="149" text-anchor="middle" fill="#adbdcc" font-size="18">used</text><text x="264.5" y="149" text-anchor="middle" fill="#91a0ab" font-size="18">free</text></g></svg>
