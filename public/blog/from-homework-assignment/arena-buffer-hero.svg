<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="arena-title arena-description"><title id="arena-title">Arena allocator</title><desc id="arena-description">Conceptual 64-byte buffer. A u32 occupies bytes 0 through 3, three f32 values occupy bytes 4 through 15, and two u64 values occupy bytes 16 through 31. The cursor points to byte 32. The remaining 32 bytes are free; end points one past byte 63. Addresses are hexadecimal.</desc><rect width="720" height="440" fill="#090d11"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="305" y="40" font-size="14" fill="#9ba5aa" letter-spacing="2">CONTIGUOUS BUFFER</text><text x="665" y="40" text-anchor="end" font-size="14" fill="#7f8b93">64 B</text><path d="M40 136h185v176H40z" fill="#0c1014" stroke="#38434b"/><text x="57" y="166" font-size="21" font-weight="600" fill="#f1f3f4">Arena {</text><text x="57" y="202" font-size="16" fill="#b7c4cb">base</text><text x="57" y="243" font-size="16" fill="#ff91b2">cursor</text><text x="57" y="284" font-size="16" fill="#b7c4cb">end</text><text x="207" y="300" font-size="21" fill="#f1f3f4">}</text><g fill="none" stroke-width="1.5"><path d="M147 197H235V68H299" stroke="#98b6bd"/><path d="M147 238H254V212H299" stroke="#ff719b"/><path d="M147 279H241V370H665V359" stroke="#98b6bd"/></g><g fill="#98b6bd"><circle cx="147" cy="197" r="3"/><circle cx="147" cy="279" r="3"/><path d="m298 64 7 4-7 4z"/><path d="m661 361 4-7 4 7z"/></g><circle cx="147" cy="238" r="3" fill="#ff719b"/><rect x="305" y="68" width="360" height="288" fill="#0e1317" stroke="#677077" stroke-width="1"/><rect x="305" y="68" width="90" height="72" fill="#193b42" stroke="#88cbd3" stroke-opacity=".55"/><text x="350" y="111" fill="#88cbd3" font-size="23" font-weight="600" text-anchor="middle">u32</text><rect x="395" y="68" width="270" height="72" fill="#442435" stroke="#ff91b2" stroke-opacity=".55"/><text x="530" y="111" fill="#ff91b2" font-size="23" font-weight="600" text-anchor="middle">f32[3]</text><rect x="305" y="140" width="360" height="72" fill="#253345" stroke="#a2bfdc" stroke-opacity=".55"/><text x="485" y="183" fill="#a2bfdc" font-size="23" font-weight="600" text-anchor="middle">u64[2]</text><g fill="none" stroke="#c4d4dc" stroke-opacity=".08" stroke-width=".7"><path d="M305 140h360"/><path d="M305 212h360"/><path d="M305 284h360"/><path d="M327.5 68v288"/><path d="M350 68v288"/><path d="M372.5 68v288"/><path d="M395 68v288"/><path d="M417.5 68v288"/><path d="M440 68v288"/><path d="M462.5 68v288"/><path d="M485 68v288"/><path d="M507.5 68v288"/><path d="M530 68v288"/><path d="M552.5 68v288"/><path d="M575 68v288"/><path d="M597.5 68v288"/><path d="M620 68v288"/><path d="M642.5 68v288"/></g><text x="290" y="109" fill="#889095" text-anchor="end" font-size="14">0x0000</text><text x="290" y="181" fill="#889095" text-anchor="end" font-size="14">0x0010</text><text x="290" y="253" fill="#ff719b" text-anchor="end" font-size="14">0x0020</text><text x="290" y="325" fill="#889095" text-anchor="end" font-size="14">0x0030</text><path d="M299 212H665" stroke="#ff719b" stroke-width="2"/><path d="M297 208l6 4-6 4" fill="none" stroke="#ff719b" stroke-width="1.5"/><text x="485" y="255" fill="#ff91b2" font-size="20" text-anchor="middle">next free byte</text><text x="485" y="327" fill="#7f8b93" font-size="20" text-anchor="middle">unused capacity</text><text x="665" y="398" text-anchor="end" font-size="14" fill="#8d999f">0x0040 · end</text><text x="40" y="398" font-size="13" fill="#67747c">Conceptual layout</text></g></svg>
